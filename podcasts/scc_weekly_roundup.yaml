# ============================================
#  Weekly Supreme Court Roundup
# ============================================

podcast:
  name: "Weekly Supreme Court Roundup"
  description: "All recent Supreme Court of Canada decisions — broad coverage for the public"
  schedule: weekly
  language: en
  audience: "general public with no legal background"
  tone: "plain-language, friendly, engaging"

# --- What to fetch ---
filter:
  doc_type: cases
  datasets: [SCC]
  date_range:
    mode: relative
    last_n_days: 7
  query: "Canada"
  search_type: full_text
  sort: newest_first
  max_results: 10
  fetch_full_text: true
  max_text_chars: 3000
  min_text_length: 300

# --- How to process ---
processing:
  models:
    fast:
      provider: together_ai
      name: deepseek-ai/DeepSeek-V4-Flash-0731   # reasoning model, $0.14/$0.28 per 1M tokens
      temperature: 0.3
    smart:
      provider: together_ai
      name: Qwen/Qwen3.8-Flash                   # $0.15/$0.47 per 1M tokens, streaming-only (auto-handled)
      temperature: 0.5
  chain:
    - name: split_cases
      type: function
      function: split
      input: "@filter_data"

    - name: summarize
      type: llm
      model: fast
      input: "@split_cases.output"
      prompt: |
        You are a legal journalist writing for @audience.
        Tone: @tone

        Summarize this Supreme Court decision in under 200 words.
        Explain what was decided and why it matters to everyday Canadians.
        No legal jargon.

        Case: @item.case_name (@item.citation)
        Date: @item.date

        --- DECISION TEXT ---
        @item.text
        --- END ---

    - name: combine
      type: function
      function: merge
      input: "@summarize.output"
      join: "\n\n---\n\n"

    - name: weekly_digest
      type: llm
      model: smart
      input: "@combine.output"
      prompt: |
        You are writing a weekly legal newsletter for @audience.
        Tone: @tone

        Below are summaries of this week's Supreme Court decisions.
        Write a Telegram post in EXACTLY this layout. Use *single asterisks* for bold.
        Do not use Markdown headings (#), horizontal rules (---), tables, or **double asterisks**.

        🏛️ *Voice of the Courts — Weekly Supreme Court Roundup*
        _One or two sentence intro on what this week was about._

        Then for each case:

        ⚖️ *Plain-language headline for the case*
        📌 *Case:* case name
        ✅ *Result:* one sentence on who won / what the Court decided
        💡 *Why it matters:* two or three sentences for everyday Canadians
        👉 *Takeaway:* one short sentence

        End with:

        🔭 *What to watch next*
        Two or three sentences on themes to expect.

        Put ONE empty line between every block (intro, each case, what to watch),
        and keep the lines inside a case block together with no empty lines.
        Keep the total under 600 words. No legal jargon.

        --- SUMMARIES ---
        @input
        --- END ---

# --- Telegram ---
telegram:
  bot_token_env: "TELEGRAM_BOT_TOKEN"
  channel_env: "TELEGRAM_TEST_CHANNEL"   # or channel: "@name" / "-100123..."
  send_digest: true
  send_audio: true
  parse_mode: "Markdown"

# --- TTS ---
tts:
  provider: elevenlabs        # any LiteLLM speech provider (openai, elevenlabs, azure, gemini, ...)
  model: eleven_flash_v2_5     # 0.5 credit/char, cheapest; eleven_multilingual_v2 for higher quality
  voice: alloy                # OpenAI-style alias or an ElevenLabs voice id
  output_dir: data/audio
  filename: "{podcast}_{date}.mp3"
  max_chars: 4000
